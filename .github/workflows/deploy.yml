name: Deploy a Raiola

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: client
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          npm ci
          npm run build
          cat > dist/.htaccess <<'EOF'
          RewriteEngine On
          RewriteBase /
          # Solo https: sin esto, el primer acceso podría ir en claro
          RewriteCond %{HTTPS} !=on
          RewriteRule ^(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
          RewriteCond %{REQUEST_URI} !^/api
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.html [L]

          <IfModule mod_headers.c>
            Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
            Header always set X-Content-Type-Options "nosniff"
            Header always set X-Frame-Options "DENY"
            Header always set Referrer-Policy "strict-origin-when-cross-origin"
            Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()"
            Header always set Cross-Origin-Opener-Policy "same-origin"
            # El index nunca se cachea: así un despliegue nuevo llega siempre
            <FilesMatch "index\.html$">
              Header always set Cache-Control "no-cache, must-revalidate"
            </FilesMatch>
          </IfModule>
          EOF

      # La API se despliega sola en Render con cada push (ver render.yaml).

      - name: Subir frontend (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: client/dist/
          server-dir: portal.alvaroalabart.es/
          state-name: .ftp-deploy-state.json

      - name: Verificar producción
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://portal.alvaroalabart.es/ || true)
          echo "Front -> HTTP $code"

      # Deja constancia de la huella del HTML recién publicado: a partir de
      # ahora, cualquier cambio en el servidor que no venga de un despliegue
      # dispara un aviso por correo.
      - name: Fijar huella del front
        run: |
          sleep 10
          curl -fsS -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 60 --retry 3 --retry-delay 15 \
            https://aa-portal-api.onrender.com/api/push/front-hash || echo "aviso: no se pudo fijar la huella"
