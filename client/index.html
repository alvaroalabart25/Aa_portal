<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- La barra de estado del iPhone en la PWA: sin esto iOS pinta una franja
         blanca opaca FUERA de la página (ningún velo nuestro puede taparla y
         al abrir un popup quedaba un corte raro arriba). En negro de marca es
         coherente siempre. OJO: se aplica al (re)instalar la PWA. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Aa Portal</title>
  </head>
